name: Curious World Daily Shorts

on:
  schedule:
    # Daily at 13:23 UTC; avoid the busy top-of-hour schedule window.
    - cron: "23 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curious-world-daily-short
  cancel-in-progress: false

jobs:
  create-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository and topic history
        uses: actions/checkout@v4

      - name: Install free production tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade requests Pillow edge-tts google-api-python-client google-auth google-auth-oauthlib

      - name: Research and select a fresh daily topic
        run: |
          python discover_topic.py

      - name: Generate licensed-footage YouTube Short
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python create_short.py

      - name: Save topic history to prevent repeats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add topic_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Record today's Curious World topic"
            git push
          fi

      - name: Upload Short to YouTube automatically
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python upload_youtube.py

      - name: Save video and source credits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curious-world-short
          path: |
            output/curious-world-short.mp4
            output/video-credits.txt
            output/youtube-description.txt
            output/narration.srt
            topic.json
          retention-days: 7
          if-no-files-found: warn
