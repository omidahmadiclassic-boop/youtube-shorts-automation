name: YouTube Shorts Automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install video, font and narration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
          python -m pip install --upgrade Pillow

      - name: Generate narrated YouTube Short
        run: |
          python create_short.py

      - name: Save generated video
        uses: actions/upload-artifact@v4
        with:
          name: curious-world-short
          path: output/curious-world-short.mp4
          retention-days: 7
